<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avcı AI - Yapay Zeka Asistanı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 85vh;
            background-color: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .chat-header {
            background-color: #0f172a;
            padding: 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h1 {
            font-size: 1.2rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: #0284c7;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: #334155;
            color: #f1f5f9;
            border-bottom-left-radius: 2px;
            border-left: 4px solid #38bdf8;
        }

        .chat-input-area {
            padding: 15px;
            background-color: #0f172a;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            background-color: #1e293b;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #ffffff;
            outline: none;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        button {
            padding: 12px 24px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0369a1;
        }

        .system-config {
            padding: 10px 20px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .system-config input {
            font-size: 0.85rem;
            padding: 6px 10px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1>🏹 Avcı AI Sistem Arayüzü</h1>
        </div>

        <!-- API Key Giriş Alanı -->
        <div class="system-config">
            <span style="font-size: 0.85rem; color: #94a3b8;">API Key:</span>
            <input type="password" id="apiKeyInput" placeholder="Gemini API Anahtarını Buraya Yapıştırın">
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message ai-message">
                Merhaba! Ben <b>Avcı AI</b>. Özel sistem talimatlarıyla yapılandırıldım. Sorularını keskin ve odaklı bir şekilde yanıtlamaya hazırım.
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Avcı AI'ya bir mesaj gönderin..." onkeydown="checkEnter(event)">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script>
        // Avcı AI Sistem Talimatı (System Instruction)
        const avciTalimati = `Sen "Avcı AI" adında özel bir yapay zeka asistanısın. 
Görevlerin:
1. Kullanıcıya her zaman odaklı, keskin, mantıklı ve doğrudan yanıtlar vermek.
2. Karmaşık problemleri bir avcı gibi iz sürerek adım adım çözmek.
3. Yanıtlarında kendine güvenen, kararlı ve yardımsever bir üslup kullanmak.`;

        async function sendMessage() {
            const userInput = document.getElementById("userInput");
            const apiKeyInput = document.getElementById("apiKeyInput");
            const chatBox = document.getElementById("chatBox");

            const messageText = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!messageText) return;

            if (!apiKey) {
                alert("Lütfen önce yukarıdaki alana Gemini API anahtarınızı girin!");
                return;
            }

            // Kullanıcı Mesajını Ekrana Ekle
            appendMessage(messageText, "user-message");
            userInput.value = "";

            // "Düşünüyor..." mesajı ekle
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "message ai-message";
            loadingDiv.innerText = "Avcı AI iz sürüyor...";
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Gemini API Çağrısı (REST API)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: avciTalimati }]
                        },
                        contents: [{
                            parts: [{ text: messageText }]
                        }]
                    })
                });

                const data = await response.json();
                chatBox.removeChild(loadingDiv);

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    appendMessage(aiReply, "ai-message");
                } else {
                    appendMessage("Bir hata oluştu veya API yanıt vermedi. API Key'inizi kontrol edin.", "ai-message");
                }

            } catch (error) {
                chatBox.removeChild(loadingDiv);
                appendMessage("Bağlantı hatası oluştu: " + error.message, "ai-message");
            }
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById("chatBox");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function checkEnter(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>

</body>
  </html>
